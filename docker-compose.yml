services:
  web:
    build: .
    ports: ["5000:5000"]
    environment:
      MONGO_URI: mongodb://mongo:27017/feedback
      SECRET_KEY: change-me
      SEED_DEMO: "1"
    depends_on: [mongo]
  mongo:
    image: mongo:7
    volumes: [mongo_data:/data/db]
  prometheus:
    image: prom/prometheus
    volumes: ["./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml"]
    ports: ["9090:9090"]
  grafana:
    image: grafana/grafana
    ports: ["3000:3000"]
volumes:
  mongo_data:
